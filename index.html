<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سكريتير الأستاذ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E3A34">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDEFE8;
    --paper:#F7F6F0;
    --surface:#FFFFFF;
    --ink:#1E3A34;
    --ink-2:#2F5245;
    --ink-soft:#5C7268;
    --red:#B8432E;
    --red-soft:#F1DAD3;
    --gold:#C79A3A;
    --gold-soft:#F3E6C4;
    --blue:#2B4C6F;
    --blue-soft:#DCE4EC;
    --border:#DAD7C9;
    --shadow: 0 2px 10px rgba(30,58,52,0.08);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Tajawal',sans-serif;
    background:var(--bg);
    color:var(--ink);
    background-image:
      radial-gradient(circle at 100% 0%, rgba(199,154,58,0.08), transparent 40%),
      radial-gradient(circle at 0% 100%, rgba(43,76,111,0.06), transparent 40%);
    min-height:100vh;
  }
  #app{display:flex; min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:230px; flex-shrink:0;
    background:linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
    color:#F4F1E6;
    padding:22px 16px;
    display:flex; flex-direction:column; gap:6px;
    position:sticky; top:0; height:100vh;
  }
  .brand{
    font-weight:800; font-size:20px; margin-bottom:4px; letter-spacing:0.5px;
    display:flex; align-items:center; gap:10px;
  }
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(199,154,58,0.25);}
  .brand-sub{font-size:12px; color:#B9C6BE; margin-bottom:22px; padding-right:20px;}
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:11px 12px; border-radius:10px; cursor:pointer;
    font-size:14.5px; font-weight:500; color:#E7E4D3;
    transition:background .15s ease; border:1px solid transparent;
  }
  .nav-item:hover{background:rgba(255,255,255,0.06);}
  .nav-item.active{background:rgba(199,154,58,0.18); border-color:rgba(199,154,58,0.4); color:#fff;}
  .nav-icon{width:20px; text-align:center; font-size:16px;}
  .sidebar-footer{margin-top:auto; font-size:11px; color:#8FA79B; padding-right:12px; line-height:1.6;}

  /* Main */
  .main{flex:1; padding:28px 34px; max-width:1180px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px;}
  .page-title{font-size:22px; font-weight:800; color:var(--ink);}
  .page-sub{font-size:13px; color:var(--ink-soft); margin-top:2px;}
  .btn{
    border:none; border-radius:10px; padding:9px 16px; font-family:'Tajawal',sans-serif;
    font-weight:700; font-size:13.5px; cursor:pointer; transition:transform .1s ease, opacity .15s;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-primary:hover{opacity:0.9;}
  .btn-gold{background:var(--gold); color:#3B2C08;}
  .btn-ghost{background:transparent; color:var(--ink); border:1.5px solid var(--border);}
  .btn-ghost:hover{background:rgba(30,58,52,0.05);}
  .btn-danger{background:var(--red-soft); color:var(--red);}
  .btn-sm{padding:6px 10px; font-size:12px; border-radius:8px;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}

  /* Home grid */
  .tool-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:16px;}
  .tool-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px; box-shadow:var(--shadow); cursor:pointer; position:relative;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .tool-card:hover{transform:translateY(-3px); box-shadow:0 8px 18px rgba(30,58,52,0.12);}
  .tool-card .icon{
    width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-size:20px; margin-bottom:12px;
  }
  .tool-card h3{margin:0 0 4px; font-size:15.5px; font-weight:700;}
  .tool-card p{margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.5;}
  .tool-card .soon-badge{
    position:absolute; top:14px; left:14px; background:var(--gold-soft); color:#8A6A16;
    font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:6px;
  }
  .customize-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:10px;}
  .custom-card{display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 14px; margin-bottom:8px;}
  .custom-card.hidden-tool{opacity:0.45;}
  .custom-left{display:flex; align-items:center; gap:10px; font-weight:600; font-size:14px;}
  .custom-actions{display:flex; gap:6px;}
  .icon-btn{width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center;}
  .icon-btn:hover{background:var(--paper);}

  /* Generic card / section */
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; margin-bottom:18px;}
  .empty-state{text-align:center; padding:50px 20px; color:var(--ink-soft);}
  .empty-state .big{font-size:34px; margin-bottom:10px;}
  .row{display:flex; gap:10px; align-items:center;}
  .row.wrap{flex-wrap:wrap;}
  input[type=text], input[type=number], select, input[type=date]{
    font-family:'Tajawal',sans-serif; padding:9px 12px; border-radius:9px; border:1.5px solid var(--border);
    font-size:13.5px; background:#fff; color:var(--ink);
  }
  input:focus, select:focus{outline:2px solid var(--gold); outline-offset:1px;}
  label.field-label{font-size:12px; color:var(--ink-soft); font-weight:600; margin-bottom:4px; display:block;}

  /* Class tabs */
  .class-tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; align-items:center;}
  .class-tab{padding:8px 16px; border-radius:20px; background:var(--surface); border:1.5px solid var(--border); font-size:13.5px; font-weight:600; cursor:pointer;}
  .class-tab.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .class-tab-add{padding:8px 14px; border-radius:20px; border:1.5px dashed var(--border); background:transparent; font-size:13px; cursor:pointer; color:var(--ink-soft);}

  /* Seating */
  .teacher-desk{
    margin:0 auto 26px; width:220px; text-align:center; padding:10px; border-radius:10px;
    background:linear-gradient(180deg,#3B5F52,#2F5245); color:#F4F1E6; font-size:12.5px; font-weight:700;
    box-shadow:var(--shadow);
  }
  .classroom{display:flex; flex-direction:column; gap:16px; align-items:center;}
  .desk-row{display:flex; gap:26px;}
  .desk{
    width:96px; min-height:64px; border-radius:10px; border:2px dashed var(--border);
    background:var(--paper); display:flex; align-items:center; justify-content:center; text-align:center;
    cursor:pointer; font-size:12.5px; padding:6px; position:relative; transition:all .12s ease;
  }
  .desk.filled{border-style:solid; border-color:var(--ink-2); background:#fff; font-weight:700; box-shadow:var(--shadow);}
  .desk:hover{transform:translateY(-2px);}
  .desk .remove-x{position:absolute; top:-7px; left:-7px; background:var(--red); color:#fff; width:18px; height:18px; border-radius:50%; font-size:11px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .unassigned-pool{display:flex; flex-wrap:wrap; gap:8px; margin-top:20px;}
  .pool-chip{background:var(--gold-soft); color:#7A5C12; padding:6px 12px; border-radius:20px; font-size:12.5px; font-weight:700; cursor:pointer; border:1px solid transparent;}
  .pool-chip:hover{border-color:var(--gold);}

  /* Gradebook table */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{padding:9px 8px; text-align:center; border-bottom:1px solid var(--border);}
  th{background:var(--paper); font-size:12px; color:var(--ink-soft); font-weight:700; position:relative;}
  td:first-child, th:first-child{text-align:right; padding-right:14px; font-weight:600;}
  tr:hover td{background:rgba(43,76,111,0.03);}
  .score-input{width:56px; padding:6px; text-align:center; border-radius:7px; border:1.5px solid var(--border);}
  .avg-cell{font-weight:800; color:var(--blue);}
  .col-remove{cursor:pointer; color:var(--red); font-size:11px; margin-right:4px;}
  .notebook-lines .card{background-image: repeating-linear-gradient(180deg, transparent, transparent 34px, var(--border) 35px);}
  .stats-row{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:16px;}
  .stat-box{flex:1; min-width:140px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow);}
  .stat-box .label{font-size:11.5px; color:var(--ink-soft); font-weight:700;}
  .stat-box .value{font-size:22px; font-weight:800; color:var(--ink); margin-top:2px;}

  /* Logbook */
  .day-tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .day-tab{padding:7px 14px; border-radius:9px; background:var(--surface); border:1.5px solid var(--border); font-size:13px; font-weight:600; cursor:pointer;}
  .day-tab.active{background:var(--blue); border-color:var(--blue); color:#fff;}
  .session-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px;}
  .session-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .session-head .period{font-weight:700; font-size:13.5px; color:var(--blue);}
  textarea{
    width:100%; font-family:'Tajawal',sans-serif; border:1.5px solid var(--border); border-radius:9px; padding:9px;
    font-size:13px; resize:vertical; min-height:60px;
  }
  .muted{color:var(--ink-soft); font-size:12.5px;}
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 20px; border-radius:10px; font-size:13px; font-weight:600;
    box-shadow:0 6px 18px rgba(0,0,0,0.25); opacity:0; pointer-events:none; transition:opacity .25s ease, bottom .25s ease;
    z-index:999;
  }
  .toast.show{opacity:1; bottom:32px;}
  @media (max-width:820px){
    #app{flex-direction:column;}
    .sidebar{width:100%; height:auto; position:relative; flex-direction:row; overflow-x:auto; padding:12px;}
    .brand-sub, .sidebar-footer{display:none;}
    .nav-item{white-space:nowrap;}
    .main{padding:18px;}
  }  #splash{
    position:fixed; inset:0; z-index:2000;
    background:#2A1D14;
    display:flex; align-items:center; justify-content:center;
    transition:opacity .6s ease;
  }
  #splash img{ width:100%; height:100%; object-fit:contain; }
  #splash.hide{ opacity:0; pointer-events:none; }
</style>
</head>

/* ---------------- Storage adapter ----------------
   Uses localStorage by default (works on any real web host / GitHub Pages / opened file).
   Falls back to window.storage only when it exists (Claude preview sandbox). */
const hasClaudeStorage = (typeof window!=='undefined') && window.storage && typeof window.storage.get==='function';

async function storageGet(key){
  if(hasClaudeStorage){
    try{ return await window.storage.get(key, false); }catch(e){ /* fall through to localStorage */ }
  }
  try{
    const v = localStorage.getItem(key);
    return v!==null ? {key, value:v} : null;
  }catch(e){ return null; }
}

async function storageSet(key, value){
  if(hasClaudeStorage){
    try{ return await window.storage.set(key, value, false); }catch(e){ /* fall through */ }
  }
  try{
    localStorage.setItem(key, value);
    return {key, value};
  }catch(e){ return null; }
}

async function loadState(){
  try{
    const res = await storageGet('app-data');
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      state = Object.assign(structuredClone(DEFAULT_STATE), parsed);
      if(!state.settings) state.settings = structuredClone(DEFAULT_STATE.settings);
    }
  }catch(e){
    // no data yet, keep defaults
  }
  if(!state._migratedV2){
    state.settings.hiddenTools = (state.settings.hiddenTools||[]).filter(k=>k!=='quicklinks');
    state.settings.toolOrder = ['profile','timetable','training','coordination','examsCalendar','holidays','seating','logbook','remediation','gradebook','backup'];
    delete state.quickLinks;
    state._migratedV2 = true;
    saveState(false);
  }
  if(!state._migratedV3){
    if(!state.settings.toolOrder.includes('classesHub')){
      const idx = state.settings.toolOrder.indexOf('profile');
      const insertAt = idx>=0 ? idx+1 : 0;
      state.settings.toolOrder.splice(insertAt, 0, 'classesHub');
    }
    state._migratedV3 = true;
    saveState(false);
  }
  render();
}

let saveTimer=null;
function saveState(showToast){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async ()=>{
    const res = await storageSet('app-data', JSON.stringify(state));
    if(res){ if(showToast) showToastMsg('تم الحفظ'); }
    else { showToastMsg('تعذر الحفظ، حاول مجددًا'); }
  }, 150);
}

function showToastMsg(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

    `<div class="nav-item ${currentPage==='home'?'active':''}" data-nav="home"><span class="nav-icon">🏠</span> الرئيسية</div>`,
    ...items.map(it=>`<div class="nav-item ${currentPage===it.key?'active':''}" data-nav="${it.key}"><span class="nav-icon">${it.icon}</span> ${it.name}</div>`)

    <div class="brand-sub">تطبيق من تصميم وتطوير الأستاذ: نبيل أوشيش</div>

}

function renderPage(){

  if(currentPage==='customize') return renderCustomize();
  if(currentPage==='seating') return renderSeating();
  if(currentPage==='gradebook') return renderGradebook();
  if(currentPage==='logbook') return renderLogbook();
  if(currentPage==='backup') return renderBackup();
  if(currentPage==='profile') return renderProfile();
  if(currentPage==='timetable') return renderTimetable();
  if(currentPage==='classesHub') return renderClassesHub();

/* ---------------- Gradebook ---------------- */
function computeAverage(cls, studentId){
  const cols = cls.gradeColumns;
  if(!cols.length) return null;
  let totalWeight=0, sum=0, any=false;
  cols.forEach(col=>{
    const v = cls.grades?.[studentId]?.[col.id];
    if(v!==undefined && v!==null && v!==''){
      sum += parseFloat(v) * col.weight;
      totalWeight += col.weight;
      any=true;
    }
  });
  if(!any || totalWeight===0) return null;
  return (sum/totalWeight);
}

function renderGradebook(){
  const cls = getActiveClass();
  if(!state.classes.length){
    return `<div class="topbar"><div><div class="page-title">دفتر التنقيط</div><div class="page-sub">أدخل النقاط واحسب المعدلات تلقائيًا</div></div></div>
    ${renderClassTabs()}
    <div class="card"><div class="empty-state"><div class="big">📊</div>أضف قسمًا أولًا من صفحة مخطط الجلوس أو من هنا</div></div>`;
  }
  if(!cls.students.length){
    return `<div class="topbar"><div><div class="page-title">دفتر التنقيط</div><div class="page-sub">القسم: ${cls.name}</div></div></div>
    ${renderClassTabs()}
    <div class="card"><div class="empty-state"><div class="big">🧑‍🎓</div>أضف تلاميذ لهذا القسم من صفحة مخطط الجلوس أولًا</div></div>`;
  }
  const avgs = cls.students.map(s=>computeAverage(cls,s.id)).filter(v=>v!==null);
  const classAvg = avgs.length? (avgs.reduce((a,b)=>a+b,0)/avgs.length) : null;
  const maxAvg = avgs.length? Math.max(...avgs): null;
  const minAvg = avgs.length? Math.min(...avgs): null;

  const colHeaders = cls.gradeColumns.map(col=>`<th>${col.name}<br><span style="font-weight:400; color:#B9B6A6;">(وزن ${col.weight})</span><span class="col-remove" data-remove-col="${col.id}">✕</span></th>`).join('');
  const rows = cls.students.map(s=>{
    const cells = cls.gradeColumns.map(col=>{
      const v = cls.grades?.[s.id]?.[col.id] ?? '';
      return `<td><input class="score-input" type="number" min="0" max="20" step="0.25" value="${v}" data-score-student="${s.id}" data-score-col="${col.id}"></td>`;
    }).join('');
    const avg = computeAverage(cls, s.id);
    return `<tr><td>${s.name}</td>${cells}<td class="avg-cell">${avg!==null? avg.toFixed(2): '—'}</td></tr>`;
  }).join('');

  return `
    <div class="topbar">
      <div><div class="page-title">دفتر التنقيط</div><div class="page-sub">القسم: ${cls.name}</div></div>
      <div class="row">
        <input type="text" id="newColName" placeholder="اسم التقييم (مثال: فرض 1)">
        <input type="number" id="newColWeight" placeholder="الوزن" value="1" min="1" max="10" style="width:70px;">
        <button class="btn btn-primary" data-add-col="1">إضافة عمود</button>
      </div>
    </div>
    ${renderClassTabs()}
    <div class="stats-row">
      <div class="stat-box"><div class="label">معدل القسم</div><div class="value">${classAvg!==null? classAvg.toFixed(2):'—'}</div></div>
      <div class="stat-box"><div class="label">أعلى معدل</div><div class="value">${maxAvg!==null? maxAvg.toFixed(2):'—'}</div></div>
      <div class="stat-box"><div class="label">أدنى معدل</div><div class="value">${minAvg!==null? minAvg.toFixed(2):'—'}</div></div>
      <div class="stat-box"><div class="label">عدد التلاميذ</div><div class="value">${cls.students.length}</div></div>
    </div>
    <div class="card" style="overflow-x:auto;">
      ${cls.gradeColumns.length ? `<table><thead><tr><th>التلميذ</th>${colHeaders}<th>المعدل</th></tr></thead><tbody>${rows}</tbody></table>`
      : `<div class="empty-state"><div class="big">➕</div>أضف عمود تقييم (فرض أو اختبار) من الأعلى لتبدأ إدخال النقاط</div>`}
    </div>
  `;
}

      </div>

      <textarea placeholder="محتوى الحصة، الملاحظات، الواجبات..." data-session-content="${s.id}">${s.content||''}</textarea>
    </div>`).join('') || `<div class="empty-state"><div class="big">✏️</div>لا توجد حصص بعد ليوم ${editingLogDay}</div>`;

  return `
    <div class="topbar">
      <div><div class="page-title">الكراس اليومي</div><div class="page-sub">القسم: ${cls.name}</div></div>
      <button class="btn btn-primary" data-add-session="1">+ إضافة حصة</button>
    </div>
    ${renderClassTabs()}
    <div class="day-tabs">${dayTabsHtml}</div>
    ${sessionsHtml}
  `;
}

/* ---------------- Teacher Profile ---------------- */

/* ---------------- Weekly Timetable ---------------- */
function renderTimetable(){
  const tt = state.timetable;
  const periodRows = tt.periods.map(per=>{
    const cells = WEEK_DAYS.map(day=>{
      const cellKey = day+'|'+per.id;
      const val = tt.grid[cellKey] || '';
      return `<td><input type="text" class="score-input" style="width:100%;" placeholder="—" value="${val}" data-tt-cell="${cellKey}"></td>`;
    }).join('');
    return `<tr>
      <td><input type="text" class="score-input" style="width:100%; font-weight:700;" value="${per.label}" data-tt-period-label="${per.id}"></td>
      ${cells}
      <td><span class="col-remove" data-tt-remove-period="${per.id}">✕</span></td>
    </tr>`;
  }).join('');
  const dayHeaders = WEEK_DAYS.map(d=>`<th>${d}</th>`).join('');
  return `
    <div class="topbar">
      <div><div class="page-title">التوزيع الزمني الأسبوعي</div><div class="page-sub">جدول حصصك عبر أيام الأسبوع</div></div>
      <button class="btn btn-primary" data-tt-add-period="1">+ إضافة حصة</button>
    </div>
    <div class="card" style="overflow-x:auto;">
      <table>
        <thead><tr><th>التوقيت</th>${dayHeaders}<th></th></tr></thead>
        <tbody>${periodRows}</tbody>
      </table>
    </div>
  `;
}

/* ---------------- Generic Log Pages ---------------- */
function renderLogPage(key){
  const cfg = LOG_CONFIGS[key];
  const entries = (state.logs[key]||[]).slice().sort((a,b)=>{
    const av=a.date||'', bv=b.date||'';
    if(av===bv) return 0;
    return cfg.sort==='asc' ? (av>bv?1:-1) : (av<bv?1:-1);
  });
  const addInputs = cfg.fields.map(f=>{
    if(f.type==='textarea'){
      return `<div style="grid-column:1/-1;"><label class="field-label">${f.label}</label><textarea id="newEntry_${f.key}" placeholder="${f.label}"></textarea></div>`;
    }
    if(f.type==='select'){
      const opts = f.options.map(o=>`<option value="${o}">${o}</option>`).join('');
      return `<div><label class="field-label">${f.label}</label><select id="newEntry_${f.key}" style="width:100%;">${opts}</select></div>`;
    }
    const inputType = f.type==='date' ? 'date' : 'text';
    return `<div><label class="field-label">${f.label}${f.required?' *':''}</label><input type="${inputType}" id="newEntry_${f.key}" style="width:100%;" placeholder="${f.label}"></div>`;
  }).join('');

  const entriesHtml = entries.map(e=>{
    const fieldRows = cfg.fields.map(f=>{
      if(f.type==='textarea'){
        return `<div style="grid-column:1/-1;"><label class="field-label">${f.label}</label><textarea data-entry-key="${key}" data-entry-id="${e.id}" data-entry-field="${f.key}">${e[f.key]||''}</textarea></div>`;
      }
      if(f.type==='select'){
        const opts = f.options.map(o=>`<option value="${o}" ${e[f.key]===o?'selected':''}>${o}</option>`).join('');
        return `<div><label class="field-label">${f.label}</label><select style="width:100%;" data-entry-key="${key}" data-entry-id="${e.id}" data-entry-field="${f.key}">${opts}</select></div>`;
      }
      const inputType = f.type==='date' ? 'date' : 'text';
      return `<div><label class="field-label">${f.label}</label><input type="${inputType}" style="width:100%;" value="${e[f.key]||''}" data-entry-key="${key}" data-entry-id="${e.id}" data-entry-field="${f.key}"></div>`;
    }).join('');
    return `<div class="session-card">
      <div class="session-head">
        <span class="period">${e.title || 'بدون عنوان'}</span>
        <button class="btn btn-danger btn-sm" data-del-entry-key="${key}" data-del-entry-id="${e.id}">حذف</button>
      </div>
      <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px;">${fieldRows}</div>
    </div>`;
  }).join('') || `<div class="card"><div class="empty-state"><div class="big">${cfg.icon}</div>لا توجد عناصر بعد</div></div>`;

  return `
    <div class="topbar"><div><div class="page-title">${cfg.title}</div><div class="page-sub">${cfg.sub}</div></div></div>
    <div class="card">
      <label class="field-label" style="margin-bottom:10px;">إضافة عنصر جديد</label>
      <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:12px;">${addInputs}</div>
      <button class="btn btn-primary" data-add-entry="${key}">إضافة</button>
    </div>
    ${entriesHtml}
  `;
}

/* ---------------- Event handling ---------------- */
function attachGlobalHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{ currentPage = el.getAttribute('data-nav'); render(); });
  });

  // Customize page
  document.querySelectorAll('[data-move]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const key = el.getAttribute('data-key');
      const dir = el.getAttribute('data-move');
      const arr = state.settings.toolOrder;
      const i = arr.indexOf(key);
      const j = dir==='up'? i-1 : i+1;
      if(j<0 || j>=arr.length) return;
      [arr[i],arr[j]] = [arr[j],arr[i]];
      saveState(); render();
    });
  });
  document.querySelectorAll('[data-toggle-hide]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const key = el.getAttribute('data-toggle-hide');
      const h = state.settings.hiddenTools;
      const i = h.indexOf(key);
      if(i>=0) h.splice(i,1); else h.push(key);
      saveState(); render();
    });
  });

  // Class tabs
  document.querySelectorAll('[data-select-class]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.activeClassId = el.getAttribute('data-select-class'); saveState(); render(); });
  });
  const addClassBtn = document.querySelector('[data-add-class]');
  if(addClassBtn) addClassBtn.addEventListener('click', ()=>{
    const name = prompt('اسم القسم الجديد (مثال: 3 ثانوي علوم تجريبية)');
    if(!name) return;
    const c = newClass(name);
    state.classes.push(c);
    state.activeClassId = c.id;
    saveState(); render();
  });

  // Classes hub
  const hubAddBtn = document.querySelector('[data-hub-add-class]');
  if(hubAddBtn) hubAddBtn.addEventListener('click', ()=>{
    const input = document.getElementById('hubNewClassName');
    const name = input.value.trim();
    if(!name) return;
    const c = newClass(name);
    state.classes.push(c);
    state.activeClassId = c.id;
    saveState(); render();
  });
  document.querySelectorAll('[data-hub-rename]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const cls = state.classes.find(c=>c.id===el.getAttribute('data-hub-rename'));
      if(cls){ cls.name = el.value; saveState(false); }
    });
  });
  document.querySelectorAll('[data-hub-delete-class]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-hub-delete-class');
      const cls = state.classes.find(c=>c.id===id);
      if(!cls) return;
      if(!confirm(`حذف قسم "${cls.name}" وكل بياناته (التلاميذ، النقاط، مخطط الجلوس)؟ هذا الإجراء لا يمكن التراجع عنه.`)) return;
      state.classes = state.classes.filter(c=>c.id!==id);
      if(state.activeClassId===id) state.activeClassId = state.classes[0]?.id || null;
      saveState(); render();
    });
  });
  document.querySelectorAll('[data-hub-remove-student]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [classId, studentId] = el.getAttribute('data-hub-remove-student').split('|');
      const cls = state.classes.find(c=>c.id===classId);
      if(!cls) return;
      cls.students = cls.students.filter(s=>s.id!==studentId);
      Object.keys(cls.seats).forEach(seatIdx=>{ if(cls.seats[seatIdx]===studentId) delete cls.seats[seatIdx]; });
      saveState(); render();
    });
  });
  document.querySelectorAll('[data-hub-import]').forEach(el=>{
    el.addEventListener('change', (e)=>{
      const classId = el.getAttribute('data-hub-import');
      const cls = state.classes.find(c=>c.id===classId);
      const file = e.target.files[0];
      if(!file || !cls) return;
      if(typeof XLSX === 'undefined'){ showToastMsg('تعذر تحميل مكتبة الاستيراد، تحقق من اتصالك بالإنترنت'); return; }
      const reader = new FileReader();
      reader.onload = (evt)=>{
        try{
          const data = new Uint8Array(evt.target.result);
          const wb = XLSX.read(data, {type:'array'});
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:''});
          const HEADER_WORDS = ['اسم','الاسم','الإسم','لقب','name','التلميذ','الرقم','رقم'];
          const existingNames = new Set(cls.students.map(s=>s.name.trim().toLowerCase()));
          let added=0, skipped=0;
          rows.forEach(row=>{
            if(!row || !row.length) return;
            const raw = String(row[0]||'').trim();
            if(!raw) return;
            const isHeaderLike = HEADER_WORDS.some(w=> raw.toLowerCase()===w.toLowerCase());
            if(isHeaderLike) return;
            const key = raw.toLowerCase();
            if(existingNames.has(key)){ skipped++; return; }
            cls.students.push({id:uid(), name:raw});
            existingNames.add(key);
            added++;
          });
          saveState(); render();
          showToastMsg(`تم استيراد ${added} تلميذ${skipped? ' (تم تجاهل '+skipped+' مكرر)':''}`);
        }catch(err){
          showToastMsg('تعذّرت قراءة الملف، تحقق من الصيغة');
        }
      };
      reader.readAsArrayBuffer(file);
      el.value = '';
    });
  });

  // Seating
  const addStudentBtn = document.querySelector('[data-add-student]');
  if(addStudentBtn) addStudentBtn.addEventListener('click', ()=>{
    const input = document.getElementById('newStudentName');
    const name = input.value.trim();
    if(!name) return;
    const cls = getActiveClass();
    cls.students.push({id:uid(), name});
    input.value='';
    saveState(); render();
  });
  document.querySelectorAll('[data-place-student]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const cls = getActiveClass();
      const sid = el.getAttribute('data-place-student');
      const total = cls.seatRows*cls.seatCols;
      for(let idx=0; idx<total; idx++){
        if(!cls.seats[idx]){ cls.seats[idx]=sid; break; }
      }
      saveState(); render();
    });
  });
  document.querySelectorAll('[data-seat]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('[data-unseat]')) return;
      const idx = el.getAttribute('data-seat');
      const cls = getActiveClass();
      if(cls.seats[idx]) return; // already filled, use x to remove
      const unassigned = cls.students.filter(s=>!Object.values(cls.seats).includes(s.id));
      if(!unassigned.length){ showToastMsg('لا يوجد تلاميذ بدون مكان'); return; }
      cls.seats[idx]=unassigned[0].id;
      saveState(); render();
    });
  });
  document.querySelectorAll('[data-unseat]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const idx = el.getAttribute('data-unseat');
      const cls = getActiveClass();
      delete cls.seats[idx];
      saveState(); render();
    });
  });
  const applyGridBtn = document.querySelector('[data-apply-grid]');
  if(applyGridBtn) applyGridBtn.addEventListener('click', ()=>{
    const cls = getActiveClass();
    const r = parseInt(document.getElementById('rowsInput').value)||3;
    const c = parseInt(document.getElementById('colsInput').value)||4;
    cls.seatRows = Math.max(1,Math.min(10,r));
    cls.seatCols = Math.max(1,Math.min(8,c));
    saveState(); render();
  });

  // Gradebook
  const addColBtn = document.querySelector('[data-add-col]');
  if(addColBtn) addColBtn.addEventListener('click', ()=>{
    const nameInput = document.getElementById('newColName');
    const weightInput = document.getElementById('newColWeight');
    const name = nameInput.value.trim();
    if(!name) return;
    const weight = parseFloat(weightInput.value)||1;
    const cls = getActiveClass();
    cls.gradeColumns.push({id:uid(), name, weight});
    saveState(); render();
  });
  document.querySelectorAll('[data-remove-col]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const cls = getActiveClass();
      const colId = el.getAttribute('data-remove-col');
      cls.gradeColumns = cls.gradeColumns.filter(c=>c.id!==colId);
      saveState(); render();
    });
  });
  document.querySelectorAll('[data-score-student]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const cls = getActiveClass();
      const sid = el.getAttribute('data-score-student');
      const cid = el.getAttribute('data-score-col');
      if(!cls.grades[sid]) cls.grades[sid]={};
      let v = el.value;
      if(v!==''){ v = Math.max(0, Math.min(20, parseFloat(v))); }
      cls.grades[sid][cid]=v;
      saveState(); render();
    });
  });

  // Logbook
  document.querySelectorAll('[data-select-day]').forEach(el=>{
    el.addEventListener('click', ()=>{ editingLogDay = el.getAttribute('data-select-day'); render(); });
  });
  const addSessionBtn = document.querySelector('[data-add-session]');
  if(addSessionBtn) addSessionBtn.addEventListener('click', ()=>{
    const cls = getActiveClass();
    if(!cls.logbook[editingLogDay]) cls.logbook[editingLogDay]=[];
    cls.logbook[editingLogDay].push({id:uid(), title:'', content:''});
    saveState(); render();
  });
  document.querySelectorAll('[data-del-session]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const cls = getActiveClass();
      const sid = el.getAttribute('data-del-session');
      cls.logbook[editingLogDay] = cls.logbook[editingLogDay].filter(s=>s.id!==sid);
      saveState(); render();
    });
  });
  document.querySelectorAll('[data-copy-session]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const cls = getActiveClass();
      const sid = el.getAttribute('data-copy-session');
      const s = cls.logbook[editingLogDay].find(x=>x.id===sid);
      if(s) cls.logbook[editingLogDay].push({id:uid(), title:s.title, content:s.content});
      saveState(); render();
    });
  });
  document.querySelectorAll('[data-session-title]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const cls = getActiveClass();
      const sid = el.getAttribute('data-session-title');
      const s = cls.logbook[editingLogDay].find(x=>x.id===sid);
      if(s) s.title = el.value;
      saveState(false);
    });
  });
  document.querySelectorAll('[data-session-content]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const cls = getActiveClass();
      const sid = el.getAttribute('data-session-content');
      const s = cls.logbook[editingLogDay].find(x=>x.id===sid);
      if(s) s.content = el.value;
      saveState(false);
    });
  });

  // Backup / restore
  const exportBtn = document.querySelector('[data-export]');
  if(exportBtn) exportBtn.addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateStr = new Date().toISOString().slice(0,10);
    a.href = url; a.download = `نسخة-احتياطية-تطبيق-الاستاذ-${dateStr}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToastMsg('تم تنزيل النسخة الاحتياطية');
  });
  const restoreBtn = document.querySelector('[data-restore]');
  if(restoreBtn) restoreBtn.addEventListener('click', ()=>{
    const fileInput = document.getElementById('restoreFile');
    const file = fileInput.files[0];
    if(!file){ showToastMsg('اختر ملفًا أولًا'); return; }
    if(!confirm('سيتم استبدال كل بياناتك الحالية بمحتوى هذا الملف. متابعة؟')) return;
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const parsed = JSON.parse(e.target.result);
        state = Object.assign(structuredClone(DEFAULT_STATE), parsed);
        saveState();
        showToastMsg('تمت استعادة البيانات بنجاح');
        currentPage='home'; render();
      }catch(err){
        showToastMsg('ملف غير صالح، تعذرت الاستعادة');
      }
    };
    reader.readAsText(file);
  });

  // Teacher profile
  document.querySelectorAll('[data-profile-field]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const key = el.getAttribute('data-profile-field');
      state.teacherProfile[key] = el.value;
      saveState(false);
    });
  });

  // Timetable
  document.querySelectorAll('[data-tt-cell]').forEach(el=>{
    el.addEventListener('input', ()=>{
      state.timetable.grid[el.getAttribute('data-tt-cell')] = el.value;
      saveState(false);
    });
  });
  document.querySelectorAll('[data-tt-period-label]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const id = el.getAttribute('data-tt-period-label');
      const per = state.timetable.periods.find(p=>p.id===id);
      if(per) per.label = el.value;
      saveState(false);
    });
  });
  const ttAddBtn = document.querySelector('[data-tt-add-period]');
  if(ttAddBtn) ttAddBtn.addEventListener('click', ()=>{
    state.timetable.periods.push({id:uid(), label:'حصة جديدة'});
    saveState(); render();
  });
  document.querySelectorAll('[data-tt-remove-period]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-tt-remove-period');
      state.timetable.periods = state.timetable.periods.filter(p=>p.id!==id);
      WEEK_DAYS.forEach(d=>{ delete state.timetable.grid[d+'|'+id]; });
      saveState(); render();
    });
  });

  // Generic log pages (training, remediation, examsCalendar, holidays, coordination)
  document.querySelectorAll('[data-add-entry]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const key = el.getAttribute('data-add-entry');
      const cfg = LOG_CONFIGS[key];
      const entry = {id:uid()};
      let valid = true;
      cfg.fields.forEach(f=>{
        const input = document.getElementById('newEntry_'+f.key);
        const val = input ? input.value.trim() : '';
        if(f.required && !val) valid = false;
        entry[f.key] = val;
      });
      if(!valid){ showToastMsg('الرجاء تعبئة الحقول المطلوبة (*)'); return; }
      if(!state.logs[key]) state.logs[key]=[];
      state.logs[key].push(entry);
      saveState(); render();
    });
  });
  document.querySelectorAll('[data-entry-field]').forEach(el=>{
    const evt = (el.tagName==='SELECT') ? 'change' : 'input';
    el.addEventListener(evt, ()=>{
      const key = el.getAttribute('data-entry-key');
      const id = el.getAttribute('data-entry-id');
      const field = el.getAttribute('data-entry-field');
      const entry = state.logs[key].find(e=>e.id===id);
      if(entry){ entry[field] = el.value; saveState(false); }
    });
  });
  document.querySelectorAll('[data-del-entry-id]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const key = el.getAttribute('data-del-entry-key');
      const id = el.getAttribute('data-del-entry-id');
      state.logs[key] = state.logs[key].filter(e=>e.id!==id);
      saveState(); render();
    });
  });
}

loadState();

setTimeout(()=>{
  const splash = document.getElementById('splash');
  if(splash){
    splash.classList.add('hide');
    setTimeout(()=>{ splash.remove(); }, 650);
  }
}, 5000);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}

</script>
</body>
</html>
